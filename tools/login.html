<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f7f3ea">
<title>Entrar — TL Games</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f3ea;color:#151515;font:17px/1.5 Arial,Helvetica,sans-serif}main{width:100%;max-width:440px;border:2px solid #151515;box-shadow:4px 4px 0 #151515;background:#fffdf8}.brand{border-bottom:2px solid #151515;padding:18px 24px;font-size:24px;font-weight:900;letter-spacing:-1px}form{padding:28px}h1{font-size:40px;line-height:1.1;letter-spacing:-1px;margin:0 0 14px}p{color:#555047;margin:0 0 24px}label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}input{width:100%;min-width:0;border:2px solid #151515;border-radius:0;padding:12px;background:#f7f3ea;font:inherit;color:#151515}button{margin-top:24px;width:100%;padding:12px;border:2px solid #151515;box-shadow:4px 4px 0 #151515;background:#1f4bd8;color:white;font:700 18px Arial,Helvetica,sans-serif;cursor:pointer}:focus-visible{outline:3px solid #1f4bd8;outline-offset:5px}.error{color:#b8321f;font-size:14px;overflow-wrap:anywhere}.error:empty{display:none}@media(max-width:400px){form{padding:22px}h1{font-size:34px}}
</style>
</head>
<body><main><div class="brand">TL GAMES / ACCESO</div><form method="post" action="{B}/login"><h1>Entra al taller.</h1><p>Sube, traduce y descarga tus juegos.</p><p class="error" role="alert">{ERROR}</p><label for="user">Usuario</label><input id="user" name="user" autocomplete="username" required autofocus><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form></main></body>
</html>
